# docker-compose.yml
# Khusus untuk VPS 1 (Aplikasi Backend Go)
# Gunakan file .env untuk mengatur environment variables
#
# Cara deploy:
# 1. Copy file .env.example menjadi .env dan isi dengan IP VPS 2 (DB & Redis)
# 2. Jalankan: docker compose up -d --build

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skripsi_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
